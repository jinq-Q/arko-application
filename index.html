<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>공연 관람 신청</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      background:#f7f7f5;
      color:#222;
      font-family:Arial,"Noto Sans KR",sans-serif
    }
    .wrap{max-width:1100px;margin:40px auto;padding:0 20px 60px}
    .card{
      background:#fff;
      border:1px solid #e6e6e2;
      border-radius:10px;
      padding:28px
    }
    h1{font-size:28px;margin:0 0 8px}
    h2{font-size:19px;margin:0}
    .sub{color:#666;margin-bottom:28px}
    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px
    }
    .field{margin-bottom:16px}
    label{
      display:block;
      font-size:14px;
      font-weight:700;
      margin-bottom:7px
    }
    select,input,button{font:inherit}
    select,input{
      width:100%;
      padding:12px 13px;
      border:1px solid #d8d8d3;
      border-radius:6px;
      background:#fff
    }
    button{
      padding:12px 14px;
      border:0;
      border-radius:6px;
      background:#222;
      color:#fff;
      cursor:pointer;
      font-weight:700
    }
    button:disabled{opacity:.4;cursor:not-allowed}
    .ghost{
      background:#fff;
      color:#222;
      border:1px solid #cfcfca
    }
    .hidden{display:none}
    .muted{color:#777;font-size:13px}
    .notice{
      padding:14px 16px;
      background:#fafaf8;
      border:1px solid #e6e6e2;
      border-radius:7px;
      margin:14px 0
    }
    .toolbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      margin:28px 0 12px
    }
    .smallbtn{
      width:auto;
      padding:8px 10px;
      font-size:12px
    }
    table{
      width:100%;
      border-collapse:collapse;
      background:#fff
    }
    th,td{
      border-top:1px solid #ecece8;
      padding:13px 10px;
      text-align:left;
      vertical-align:middle;
      font-size:14px
    }
    th{
      background:#fafaf8;
      color:#555;
      font-size:12px
    }
    .status{
      display:inline-block;
      padding:5px 8px;
      border-radius:999px;
      font-size:12px;
      font-weight:700
    }
    .pending{background:#fff4cc}
    .done{background:#def3e5}
    .closed{background:#f4dddd}
    .loading{
      padding:30px;
      text-align:center;
      color:#777
    }
    @media(max-width:760px){
      .row{grid-template-columns:1fr}
      .wrap{margin-top:20px;padding:0 12px 40px}
      .card{padding:20px}
      table{display:block;overflow-x:auto;white-space:nowrap}
    }
  </style>
</head>

<body>

<div class="wrap">

  <section class="card">

    <h1>공연 관람 신청</h1>
    <div class="sub">
      아르코예술극장 · 대학로예술극장
    </div>

    <!-- 로그인 -->
    <div id="loginBox">

      <div class="row">

        <div class="field">
          <label>이름</label>
          <select id="personSelect">
            <option value="">불러오는 중...</option>
          </select>
        </div>

        <div class="field">
          <label>휴대전화 뒤 4자리</label>
          <input
            id="pinInput"
            type="password"
            inputmode="numeric"
            maxlength="4"
            autocomplete="off"
            placeholder="휴대전화 뒤 4자리">
        </div>

      </div>

      <button id="loginBtn">
        내 신청 페이지 열기
      </button>

      <div id="loginMessage"
           class="muted"
           style="margin-top:10px">
      </div>

    </div>


    <!-- 로그인 후 -->
    <div id="memberArea" class="hidden">

      <div class="notice">
        <strong id="welcomeName"></strong>님의 신청 페이지입니다.
        제출한 신청은 직접 수정할 수 없습니다.
        관리자가 <strong>마감 · 다른 일정 선택 필요</strong>로
        변경한 경우 새로운 일정으로 다시 신청할 수 있습니다.
      </div>

      <div class="toolbar">
        <h2>신청 가능한 공연</h2>
        <button
          id="logoutBtn"
          class="ghost smallbtn">
          다른 사람으로 전환
        </button>
      </div>

      <div style="overflow-x:auto">

        <table>

          <thead>
            <tr>
              <th>공연명</th>
              <th>전체 일정</th>
              <th>공연장</th>
              <th>희망 날짜</th>
              <th>희망 시간</th>
              <th></th>
            </tr>
          </thead>

          <tbody id="showRows">
            <tr>
              <td colspan="6" class="loading">
                공연을 불러오는 중입니다.
              </td>
            </tr>
          </tbody>

        </table>

      </div>


      <div class="toolbar">
        <h2>내 신청내역</h2>
      </div>

      <div style="overflow-x:auto">

        <table>

          <thead>
            <tr>
              <th>공연명</th>
              <th>공연장</th>
              <th>희망 관람일시</th>
              <th>상태</th>
              <th>관리자 안내</th>
            </tr>
          </thead>

          <tbody id="myRows"></tbody>

        </table>

      </div>

    </div>

  </section>

</div>


<script>

/* =====================================================
   SUPABASE 연결
===================================================== */

const SUPABASE_URL = 'https://ppxgfqkikdvwkmajkayi.supabase.co';

const SUPABASE_KEY =
  "sb_publishable_YSpS83sGG6QY-a-8hurRVQ_2KD1hSiZ";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   상태
===================================================== */

let currentPerson = null;
let currentPin = "";
let performances = [];
let applications = [];


/* =====================================================
   HTML 요소
===================================================== */

const personSelect =
  document.getElementById("personSelect");

const pinInput =
  document.getElementById("pinInput");

const loginBtn =
  document.getElementById("loginBtn");

const loginBox =
  document.getElementById("loginBox");

const memberArea =
  document.getElementById("memberArea");

const welcomeName =
  document.getElementById("welcomeName");

const logoutBtn =
  document.getElementById("logoutBtn");

const showRows =
  document.getElementById("showRows");

const myRows =
  document.getElementById("myRows");

const loginMessage =
  document.getElementById("loginMessage");


/* =====================================================
   공통
===================================================== */

function fmt(date){

  if(!date) return "-";

  return date.replaceAll("-",".");

}

function statusLabel(status){

  if(status === "신청완료")
    return "신청완료";

  if(status === "마감")
    return "마감 · 다른 일정 선택 필요";

  return "신청중";

}

function statusClass(status){

  if(status === "신청완료")
    return "done";

  if(status === "마감")
    return "closed";

  return "pending";

}


/* =====================================================
   이름 목록
===================================================== */

async function loadPeople(){

  const {data,error} =
    await db.rpc("get_participant_names");

  if(error){

    console.error(error);

    personSelect.innerHTML =
      '<option value="">이름을 불러오지 못했습니다</option>';

    return;

  }

  personSelect.innerHTML =
    '<option value="">이름을 선택해주세요</option>' +

    data.map(person =>
      `<option value="${person.id}">
        ${person.name} · ${person.role}
      </option>`
    ).join("");

}


/* =====================================================
   로그인
===================================================== */

async function login(){

  const participantId =
    Number(personSelect.value);

  const pin =
    pinInput.value.trim();

  if(!participantId || !/^[0-9]{4}$/.test(pin)){

    alert("이름과 휴대전화 뒤 4자리를 확인해주세요.");

    return;

  }

  loginBtn.disabled = true;
  loginBtn.textContent = "확인 중...";

  const {data,error} =
    await db.rpc(
      "verify_participant",
      {
        participant_id: participantId,
        participant_pin: pin
      }
    );

  loginBtn.disabled = false;
  loginBtn.textContent =
    "내 신청 페이지 열기";

  if(error){

    console.error(error);

    alert("로그인 확인 중 오류가 발생했습니다.");

    return;

  }

  if(!data || data.length === 0){

    alert("이름 또는 휴대전화 뒤 4자리가 맞지 않습니다.");

    return;

  }

  currentPerson = data[0];
  currentPin = pin;

  loginBox.classList.add("hidden");
  memberArea.classList.remove("hidden");

  welcomeName.textContent =
    currentPerson.name;

  await loadMemberData();

}


/* =====================================================
   공연 + 내 신청내역
===================================================== */

async function loadMemberData(){

  showRows.innerHTML =
    `<tr>
      <td colspan="6" class="loading">
        공연을 불러오는 중입니다.
      </td>
    </tr>`;

  const performanceResult =
    await db.rpc("get_performances");

  if(performanceResult.error){

    console.error(performanceResult.error);

    showRows.innerHTML =
      `<tr>
        <td colspan="6">
          공연 정보를 불러오지 못했습니다.
        </td>
      </tr>`;

    return;

  }

  performances =
    performanceResult.data || [];


  const applicationResult =
    await db.rpc(
      "get_my_applications",
      {
        participant_id: currentPerson.id,
        participant_pin: currentPin
      }
    );

  if(applicationResult.error){

    console.error(applicationResult.error);

    alert("신청내역을 불러오지 못했습니다.");

    return;

  }

  applications =
    applicationResult.data || [];

  renderPerformances();
  renderApplications();

}


/* =====================================================
   공연 목록
===================================================== */

function renderPerformances(){

  if(performances.length === 0){

    showRows.innerHTML =
      `<tr>
        <td colspan="6" class="muted">
          현재 신청 가능한 공연이 없습니다.
        </td>
      </tr>`;

    return;

  }

  showRows.innerHTML =
    performances.map(show => {

      const existing =
        applications.find(app =>
          Number(app.performance_id) ===
          Number(show.id) &&
          app.status !== "마감"
        );

      const closed =
        applications.some(app =>
          Number(app.performance_id) ===
          Number(show.id) &&
          app.status === "마감"
        );

      const disabled =
        Boolean(existing);

      return `

        <tr>

          <td>
            <strong>${show.title}</strong>
          </td>

          <td>
            ${fmt(show.start_date)}
            ~
            ${fmt(show.end_date)}
          </td>

          <td>
            ${show.venue}
          </td>

          <td>

            <input
              type="date"
              id="date-${show.id}"
              min="${show.start_date}"
              max="${show.end_date}"
              ${disabled ? "disabled" : ""}>

          </td>

          <td>

            <input
              type="time"
              id="time-${show.id}"
              ${disabled ? "disabled" : ""}>

          </td>

          <td>

            <button
              class="smallbtn"
              ${disabled ? "disabled" : ""}
              onclick="submitApplication(${show.id})">

              ${
                disabled
                ? "신청됨"
                : closed
                  ? "다시 신청"
                  : "신청"
              }

            </button>

          </td>

        </tr>

      `;

    }).join("");

}


/* =====================================================
   신청 저장
===================================================== */

async function submitApplication(performanceId){

  const show =
    performances.find(
      item =>
        Number(item.id) ===
        Number(performanceId)
    );

  if(!show) return;


  const date =
    document.getElementById(
      `date-${performanceId}`
    ).value;

  const time =
    document.getElementById(
      `time-${performanceId}`
    ).value;


  if(!date || !time){

    alert(
      "희망 관람 날짜와 시간을 선택해주세요."
    );

    return;

  }


  if(
    date < show.start_date ||
    date > show.end_date
  ){

    alert(
      "공연 전체 일정 안에서 날짜를 선택해주세요."
    );

    return;

  }


  const confirmed =
    confirm(
      `${show.title}\n\n` +
      `${fmt(date)} ${time}\n\n` +
      `이 일정으로 신청하시겠습니까?\n` +
      `제출 후에는 직접 수정할 수 없습니다.`
    );

  if(!confirmed) return;


  const {error} =
    await db.rpc(
      "submit_application",
      {
        participant_id:
          currentPerson.id,

        participant_pin:
          currentPin,

        performance_id:
          performanceId,

        preferred_date:
          date,

        preferred_time:
          time
      }
    );


  if(error){

    console.error(error);

    alert(
      "신청을 저장하지 못했습니다.\n" +
      error.message
    );

    return;

  }


  alert("신청이 접수되었습니다.");

  await loadMemberData();

}


/* =====================================================
   신청내역 표시
===================================================== */

function renderApplications(){

  if(applications.length === 0){

    myRows.innerHTML =
      `<tr>
        <td colspan="5" class="muted">
          아직 신청내역이 없습니다.
        </td>
      </tr>`;

    return;

  }


  myRows.innerHTML =
    applications.map(app => `

      <tr>

        <td>
          ${app.performance_title || app.title || "-"}
        </td>

        <td>
          ${app.venue || "-"}
        </td>

        <td>
          ${fmt(app.preferred_date)}
          ${app.preferred_time
            ? String(app.preferred_time).slice(0,5)
            : ""}
        </td>

        <td>

          <span
            class="status ${statusClass(app.status)}">

            ${statusLabel(app.status)}

          </span>

        </td>

        <td>
          ${app.admin_note || "-"}
        </td>

      </tr>

    `).join("");

}


/* =====================================================
   로그아웃
===================================================== */

function logout(){

  currentPerson = null;
  currentPin = "";
  performances = [];
  applications = [];

  pinInput.value = "";
  personSelect.value = "";

  memberArea.classList.add("hidden");
  loginBox.classList.remove("hidden");

}


/* =====================================================
   버튼
===================================================== */

loginBtn.addEventListener(
  "click",
  login
);

pinInput.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter")
      login();

  }
);

logoutBtn.addEventListener(
  "click",
  logout
);


/* =====================================================
   시작
===================================================== */

loadPeople();

</script>

</body>
</html>
